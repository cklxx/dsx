name: test-no-env
on:
  workflow_call: {}
  workflow_dispatch:

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.detect.outputs.required }}
    steps:
      - id: detect
        run: echo "required=false" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    if: ${{ needs.metadata.outputs.required == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
    steps:
      - run: echo "should be skipped"
