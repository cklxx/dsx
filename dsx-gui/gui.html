<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dsx</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<style>
  /* ============================================================
     DESIGN TOKENS
     ============================================================ */
  :root {
    --bg: #0a0a0b;
    --bg-elevated: #111113;
    --bg-hover: #18181b;
    --bg-active: #1f1f23;
    --surface: #151518;
    --surface-2: #1c1c20;
    --border: #26262c;
    --border-light: #1e1e23;
    --text: #e8e8ea;
    --text-secondary: #9b9ba3;
    --text-tertiary: #6b6b74;
    --accent: #e8e8ea;
    --accent-bg: #2a2a30;
    --accent-hover: #35353c;
    --user-msg: #1a1a1f;
    --agent-msg: transparent;
    --success: #4ade80;
    --warning: #fbbf24;
    --error: #f87171;
    --info: #60a5fa;
    --radius-sm: 6px;
    --radius: 8px;
    --radius-lg: 12px;
    --radius-xl: 16px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow: 0 2px 8px rgba(0,0,0,0.4);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
    --font: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
    --sidebar-w: 280px;
    --topbar-h: 44px;
    --composer-h: 80px;
    --transition: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* ============================================================
     RESET & BASE
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden;
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea { font-family: inherit; }
  a { color: var(--info); text-decoration: none; }
  ::selection { background: rgba(96,165,250,0.3); }

  /* ============================================================
     SCROLLBAR
     ============================================================ */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

  /* ============================================================
     APP SHELL
     ============================================================ */
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: var(--bg);
  }

  /* ============================================================
     TITLE BAR (macOS-style traffic lights area)
     ============================================================ */
  #titlebar {
    height: var(--topbar-h);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding: 0 16px;
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border-light);
    -webkit-app-region: drag;
    position: relative;
    z-index: 10;
  }
  .traffic-lights {
    display: flex;
    gap: 8px;
    margin-right: 16px;
    -webkit-app-region: no-drag;
  }
  .traffic-light {
    width: 12px; height: 12px;
    border-radius: 50%;
    transition: filter var(--transition);
  }
  .traffic-light:hover { filter: brightness(1.2); }
  .tl-close { background: #ff5f57; }
  .tl-min { background: #febc2e; }
  .tl-max { background: #28c840; }

  .titlebar-center {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .conn-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-tertiary);
    -webkit-app-region: no-drag;
  }
  .conn-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-tertiary);
    transition: all var(--transition);
  }
  .conn-dot.connected {
    background: var(--success);
    box-shadow: 0 0 8px rgba(74,222,128,0.4);
  }
  .conn-dot.error { background: var(--error); }
  .conn-dot.connecting {
    background: var(--warning);
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .titlebar-right {
    display: flex;
    align-items: center;
    gap: 8px;
    -webkit-app-region: no-drag;
  }
  .ws-input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    font-size: 11px;
    font-family: var(--font-mono);
    width: 180px;
    outline: none;
    transition: border-color var(--transition);
  }
  .ws-input:focus { border-color: var(--text-tertiary); }

  .icon-btn {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    transition: all var(--transition);
    font-size: 14px;
  }
  .icon-btn:hover { background: var(--bg-hover); color: var(--text); }
  .icon-btn.active { background: var(--accent-bg); color: var(--text); }

  /* ============================================================
     MAIN LAYOUT
     ============================================================ */
  #main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* ============================================================
     SIDEBAR
     ============================================================ */
  #sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--bg-elevated);
    border-right: 1px solid var(--border-light);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-bottom: 1px solid var(--border-light);
  }

  .new-chat-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 14px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
    transition: all var(--transition);
  }
  .new-chat-btn:hover:not(:disabled) {
    background: var(--bg-hover);
    border-color: var(--text-tertiary);
  }
  .new-chat-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .new-chat-btn .plus { font-size: 16px; font-weight: 300; line-height: 1; }

  .search-box {
    position: relative;
  }
  .search-box svg {
    position: absolute;
    left: 8px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-tertiary);
    pointer-events: none;
  }
  .search-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px 6px 28px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    outline: none;
    transition: border-color var(--transition);
  }
  .search-input:focus { border-color: var(--text-tertiary); }
  .search-input::placeholder { color: var(--text-tertiary); }

  .sidebar-section-label {
    padding: 12px 14px 6px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-tertiary);
  }

  #thread-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 6px 12px;
  }

  .thread-card {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 8px 10px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background var(--transition);
    position: relative;
    margin-bottom: 1px;
  }
  .thread-card:hover { background: var(--bg-hover); }
  .thread-card.active {
    background: var(--bg-active);
  }
  .thread-card.active::before {
    content: '';
    position: absolute;
    left: -6px; top: 50%;
    transform: translateY(-50%);
    width: 2px; height: 20px;
    background: var(--text);
    border-radius: 1px;
  }

  .thread-card-top {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .thread-status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .thread-status-dot.active {
    background: var(--info);
    box-shadow: 0 0 6px rgba(96,165,250,0.5);
  }
  .thread-status-dot.idle { background: var(--text-tertiary); opacity: 0.5; }

  .thread-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .thread-card.active .thread-title { color: var(--text); font-weight: 600; }

  .thread-preview {
    font-size: 11px;
    color: var(--text-tertiary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding-left: 12px;
  }

  .thread-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-left: 12px;
    font-size: 10px;
    color: var(--text-tertiary);
  }

  .sidebar-footer {
    padding: 10px 12px;
    border-top: 1px solid var(--border-light);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .model-badge {
    font-size: 10px;
    font-weight: 500;
    color: var(--text-secondary);
    background: var(--surface-2);
    padding: 3px 8px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }

  /* ============================================================
     CHAT AREA
     ============================================================ */
  #chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }

  #chat-header {
    height: 48px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding: 0 20px;
    border-bottom: 1px solid var(--border-light);
    background: var(--bg);
  }
  .chat-header-left {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .chat-thread-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    transition: background var(--transition);
  }
  .chat-thread-name:hover { background: var(--bg-hover); }
  .chat-thread-name[contenteditable="true"] {
    outline: none;
    background: var(--bg-hover);
    color: var(--text);
  }
  .chat-cwd {
    font-size: 11px;
    color: var(--text-tertiary);
    font-family: var(--font-mono);
    padding: 2px 8px;
    background: var(--surface-2);
    border-radius: 4px;
    border: 1px solid var(--border-light);
  }
  .chat-header-actions {
    display: flex;
    gap: 4px;
  }
  .action-btn {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--radius-sm);
    color: var(--text-tertiary);
    transition: all var(--transition);
    font-size: 13px;
  }
  .action-btn:hover { background: var(--bg-hover); color: var(--text); }

  /* ============================================================
     MESSAGES
     ============================================================ */
  #messages-container {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
  }
  #messages {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 20px 16px;
  }

  .msg-group {
    margin-bottom: 20px;
    display: flex;
    gap: 12px;
    animation: msgIn 0.25s ease;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-avatar {
    width: 28px; height: 28px;
    border-radius: 7px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
  }
  .msg-avatar.user {
    background: var(--surface-2);
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .msg-avatar.assistant {
    background: linear-gradient(135deg, #2a2a30, #1a1a1f);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .msg-body {
    flex: 1;
    min-width: 0;
  }

  .msg-sender {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .msg-time {
    font-size: 10px;
    font-weight: 400;
    color: var(--text-tertiary);
  }

  .msg-content {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
    word-break: break-word;
    white-space: pre-wrap;
  }

  .msg-bubble.user {
    background: var(--user-msg);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 10px 14px;
    display: inline-block;
    max-width: 100%;
  }

  .msg-bubble.agent {
    padding: 2px 0;
  }
  .msg-bubble.agent.streaming .msg-content::after {
    content: '▍';
    color: var(--text-tertiary);
    animation: blink 1s step-end infinite;
    margin-left: 1px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* System messages */
  .system-msg {
    text-align: center;
    margin: 12px 0;
    font-size: 11px;
    color: var(--text-tertiary);
  }
  .system-msg span {
    display: inline-block;
    padding: 3px 12px;
    background: var(--surface-2);
    border-radius: 20px;
    border: 1px solid var(--border-light);
  }
  .system-msg.error span {
    color: var(--error);
    border-color: rgba(248,113,113,0.2);
    background: rgba(248,113,113,0.08);
  }

  /* ============================================================
     TOOL CALLS
     ============================================================ */
  .tool-call {
    margin: 6px 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color var(--transition);
  }
  .tool-call:hover { border-color: var(--text-tertiary); }

  .tool-call-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    cursor: pointer;
    user-select: none;
    transition: background var(--transition);
  }
  .tool-call-header:hover { background: var(--bg-hover); }

  .tool-icon {
    width: 22px; height: 22px;
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    flex-shrink: 0;
    background: var(--surface-2);
    border: 1px solid var(--border-light);
  }

  .tool-name {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    font-family: var(--font-mono);
    letter-spacing: 0.02em;
  }

  .tool-title {
    font-size: 12px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  .tool-status {
    font-size: 10px;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: 10px;
    flex-shrink: 0;
  }
  .tool-status.running {
    color: var(--warning);
    background: rgba(251,191,36,0.1);
  }
  .tool-status.done {
    color: var(--success);
    background: rgba(74,222,128,0.1);
  }
  .tool-status.failed {
    color: var(--error);
    background: rgba(248,113,113,0.1);
  }

  .tool-toggle {
    color: var(--text-tertiary);
    font-size: 10px;
    transition: transform var(--transition);
    flex-shrink: 0;
  }
  .tool-toggle.open { transform: rotate(90deg); }

  .tool-detail {
    padding: 0 10px 8px 40px;
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--text-secondary);
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 160px;
    overflow-y: auto;
    display: none;
    line-height: 1.5;
  }
  .tool-detail.open { display: block; }
  .tool-detail.file-output { color: var(--success); }
  .tool-detail.cmd-output { color: var(--text-tertiary); }

  /* ============================================================
     REASONING
     ============================================================ */
  .reasoning-block {
    margin: 4px 0;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border-light);
  }
  .reasoning-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    font-size: 11px;
    color: var(--text-tertiary);
    cursor: pointer;
    user-select: none;
    background: var(--surface);
    transition: color var(--transition);
  }
  .reasoning-toggle:hover { color: var(--text-secondary); }
  .reasoning-arrow {
    font-size: 8px;
    transition: transform var(--transition);
  }
  .reasoning-arrow.open { transform: rotate(90deg); }
  .reasoning-body {
    padding: 0 10px 8px 24px;
    font-size: 12px;
    color: var(--text-tertiary);
    font-style: italic;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    display: none;
    background: var(--surface);
  }
  .reasoning-body.open { display: block; }

  /* ============================================================
     COMPOSER (INPUT AREA)
     ============================================================ */
  #composer {
    flex-shrink: 0;
    padding: 12px 20px 16px;
    background: var(--bg);
  }
  .composer-inner {
    max-width: 760px;
    margin: 0 auto;
  }
  .composer-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    transition: border-color var(--transition), box-shadow var(--transition);
    overflow: hidden;
  }
  .composer-box:focus-within {
    border-color: var(--text-tertiary);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.04);
  }
  .composer-box.disabled {
    opacity: 0.5;
    pointer-events: none;
  }

  #input {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 12px 14px 8px;
    font-size: 14px;
    line-height: 1.5;
    resize: none;
    outline: none;
    min-height: 24px;
    max-height: 140px;
  }
  #input::placeholder { color: var(--text-tertiary); }

  .composer-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 10px 8px;
  }
  .composer-hint {
    font-size: 10px;
    color: var(--text-tertiary);
  }
  .composer-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .send-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 5px 14px;
    background: var(--text);
    color: var(--bg);
    border-radius: var(--radius);
    font-size: 12px;
    font-weight: 600;
    transition: all var(--transition);
    height: 28px;
  }
  .send-btn:hover:not(:disabled) {
    opacity: 0.88;
    transform: translateY(-1px);
  }
  .send-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }
  .send-btn.interrupt {
    background: var(--error);
    color: #fff;
  }
  .send-btn.interrupt:hover:not(:disabled) { opacity: 0.88; }

  /* ============================================================
     EMPTY STATE
     ============================================================ */
  #empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    color: var(--text-tertiary);
  }
  .empty-logo {
    width: 56px; height: 56px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--surface-2), var(--surface));
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    box-shadow: var(--shadow-lg);
  }
  .empty-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
  }
  .empty-subtitle {
    font-size: 13px;
    color: var(--text-tertiary);
    text-align: center;
    max-width: 320px;
    line-height: 1.5;
  }
  .empty-cta {
    margin-top: 8px;
    padding: 9px 20px;
    background: var(--text);
    color: var(--bg);
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 600;
    transition: all var(--transition);
  }
  .empty-cta:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
  .empty-cta:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ============================================================
     UTILITY
     ============================================================ */
  .hidden { display: none !important; }
  .fade-in { animation: msgIn 0.25s ease; }

  /* Typing indicator */
  .typing-indicator {
    display: inline-flex;
    gap: 4px;
    padding: 4px 0;
  }
  .typing-indicator span {
    width: 5px; height: 5px;
    background: var(--text-tertiary);
    border-radius: 50%;
    animation: typing 1.4s ease-in-out infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- TITLE BAR -->
  <div id="titlebar">
    <div class="traffic-lights">
      <div class="traffic-light tl-close" onclick="window.close()"></div>
      <div class="traffic-light tl-min"></div>
      <div class="traffic-light tl-max"></div>
    </div>
    <div class="titlebar-center">
      <div class="conn-indicator">
        <span class="conn-dot" id="conn-dot"></span>
        <span id="conn-text">未连接</span>
      </div>
    </div>
    <div class="titlebar-right">
      <input class="ws-input" id="ws-url" type="text" value="ws://localhost:9020" spellcheck="false">
      <button class="icon-btn" id="conn-btn" onclick="toggleConnect()" title="连接">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
      </button>
    </div>
  </div>

  <!-- MAIN -->
  <div id="main">

    <!-- SIDEBAR -->
    <div id="sidebar">
      <div class="sidebar-header">
        <button class="new-chat-btn" id="new-chat-btn" onclick="newThread()" disabled>
          <span class="plus">+</span> 新会话
        </button>
        <div class="search-box">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input class="search-input" type="text" placeholder="搜索会话" oninput="onSearch(this.value)">
        </div>
      </div>
      <div class="sidebar-section-label">最近</div>
      <div id="thread-list"></div>
      <div class="sidebar-footer">
        <span class="model-badge" id="model-badge">—</span>
      </div>
    </div>

    <!-- CHAT -->
    <div id="chat">
      <div id="chat-header" class="hidden">
        <div class="chat-header-left">
          <span class="chat-thread-name" id="thread-name" onclick="renameThread(this)">新会话</span>
          <span class="chat-cwd" id="thread-cwd"></span>
        </div>
        <div class="chat-header-actions">
          <button class="action-btn" onclick="deleteThread()" title="删除会话">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>
      </div>

      <div id="messages-container">
        <div id="messages"></div>
      </div>

      <div id="empty-state" class="hidden">
        <div class="empty-logo">⚡</div>
        <div class="empty-title">dsx</div>
        <div class="empty-subtitle">DeepSeek V4 agent<br>连接后开始新对话</div>
        <button class="empty-cta" id="empty-cta-btn" onclick="newThread()" disabled>开始新会话</button>
      </div>

      <!-- COMPOSER -->
      <div id="composer">
        <div class="composer-inner">
          <div class="composer-box" id="composer-box">
            <textarea id="input"
              placeholder="输入消息…  (Enter 发送, Shift+Enter 换行)"
              rows="1"
              disabled
              onkeydown="handleInputKey(event)"
              oninput="autoResize(this)"></textarea>
            <div class="composer-bottom">
              <span class="composer-hint" id="composer-hint"></span>
              <div class="composer-actions">
                <button class="send-btn" id="send-btn" onclick="handleSend()" disabled>
                  <span id="send-text">发送</span>
                  <svg id="send-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
// ============================================================
// dsx GUI — app-server WebSocket client (v2)
// ============================================================

let ws = null;
let reqId = 0;
let pendingRequests = new Map();
let connected = false;

let currentThreadId = null;
let currentThreadName = null;
let currentTurnId = null;
let currentCwd = null;
let threads = [];
let searchTerm = '';

let streamingItemId = null;
let streamingEl = null;
let isStreaming = false;
let itemEls = new Map();

// ============================================================
// CONNECTION
// ============================================================

function toggleConnect() {
  if (ws) { ws.close(); }
  else { connect(); }
}

function connect() {
  const url = (document.getElementById('ws-url').value || 'ws://localhost:9020').trim();
  setConnState('connecting');

  try { ws = new WebSocket(url); }
  catch (e) { setConnState('error'); return; }

  ws.onopen = () => {
    sendRpc('initialize', {
      clientInfo: { name: 'dsx-gui', version: '0.2.0' },
      capabilities: { experimentalApi: true, optOutNotificationMethods: [] }
    }).then(() => {
      setConnState('connected');
      loadThreadList().then(() => {
        // Auto-create a thread if none exists
        if (!currentThreadId && threads.length === 0) {
          newThread();
        }
      });
      enableControls(true);
    }).catch(e => {
      addSystemMsg('初始化失败: ' + (e.message || e), true);
      setConnState('error');
    });
  };

  ws.onclose = () => {
    ws = null;
    connected = false;
    currentThreadId = null;
    streamingItemId = null;
    isStreaming = false;
    setConnState('disconnected');
    enableControls(false);
    addSystemMsg('连接已关闭');
  };

  ws.onerror = () => setConnState('error');

  ws.onmessage = (e) => {
    try { handleMessage(JSON.parse(e.data)); }
    catch (err) { console.error('parse error', err); }
  };
}

function setConnState(state) {
  const dot = document.getElementById('conn-dot');
  const text = document.getElementById('conn-text');
  dot.className = 'conn-dot';
  switch (state) {
    case 'connected':
      dot.classList.add('connected');
      text.textContent = '已连接';
      connected = true;
      break;
    case 'connecting':
      dot.classList.add('connecting');
      text.textContent = '连接中…';
      break;
    case 'error':
      dot.classList.add('error');
      text.textContent = '连接失败';
      break;
    default:
      text.textContent = '未连接';
  }
}

function enableControls(enabled) {
  document.getElementById('new-chat-btn').disabled = !enabled;
  document.getElementById('empty-cta-btn').disabled = !enabled;
  const composer = document.getElementById('composer-box');
  if (enabled && currentThreadId) {
    composer.classList.remove('disabled');
    document.getElementById('input').disabled = false;
  } else {
    composer.classList.add('disabled');
    document.getElementById('input').disabled = true;
  }
}

// ============================================================
// RPC
// ============================================================

function sendRpc(method, params) {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    return Promise.reject(new Error('未连接'));
  }
  const id = ++reqId;
  ws.send(JSON.stringify({ id, method, params }));
  return new Promise((resolve, reject) => {
    pendingRequests.set(id, { resolve, reject, method });
    setTimeout(() => {
      if (pendingRequests.has(id)) {
        pendingRequests.delete(id);
        reject(new Error('超时: ' + method));
      }
    }, 30000);
  });
}

function handleMessage(msg) {
  if (msg.id !== undefined && !msg.method) {
    const p = pendingRequests.get(msg.id);
    if (p) {
      pendingRequests.delete(msg.id);
      msg.error ? p.reject(msg.error) : p.resolve(msg.result);
    }
    return;
  }
  if (msg.method && msg.id !== undefined) {
    handleServerRequest(msg);
    return;
  }
  if (msg.method) {
    handleNotification(msg.method, msg.params || {});
  }
}

function handleServerRequest(msg) {
  // ponytail: auto-approve everything for now
  const m = msg.method;
  if (m === 'item/commandExecution/requestApproval' || m === 'item/fileChange/requestApproval') {
    ws.send(JSON.stringify({ id: msg.id, result: { decision: 'accept' } }));
  } else if (m === 'item/permissions/requestApproval') {
    ws.send(JSON.stringify({ id: msg.id, result: { accept: true } }));
  } else if (m === 'currentTime/read') {
    ws.send(JSON.stringify({ id: msg.id, result: { isoTime: new Date().toISOString() } }));
  } else {
    ws.send(JSON.stringify({ id: msg.id, result: {} }));
  }
}

// ============================================================
// NOTIFICATIONS
// ============================================================

function handleNotification(method, p) {
  if (p.threadId && p.threadId !== currentThreadId) {
    if (['thread/status/changed','thread/name/updated','thread/started'].includes(method)) {
      loadThreadList();
    }
    return;
  }

  switch (method) {
    case 'thread/started':
    case 'thread/status/changed':
      loadThreadList(); break;

    case 'thread/name/updated':
      if (p.threadName) {
        currentThreadName = p.threadName;
        updateHeader();
      }
      loadThreadList(); break;

    case 'turn/started':
      isStreaming = true;
      currentTurnId = p.turn?.id || null;
      updateSendBtn();
      showTypingIndicator();
      break;

    case 'turn/completed':
      isStreaming = false;
      currentTurnId = null;
      streamingItemId = null;
      streamingEl = null;
      hideTypingIndicator();
      updateSendBtn();
      if (p.turn?.durationMs) {
        addSystemMsg('完成于 ' + (p.turn.durationMs / 1000).toFixed(1) + 's');
      }
      break;

    case 'item/started':
      if (p.item?.type === 'agentMessage') hideTypingIndicator();
      handleItemStarted(p.item); break;

    case 'item/completed':
      handleItemCompleted(p.item); break;

    case 'item/agentMessage/delta':
      if (p.itemId === streamingItemId && streamingEl) {
        streamingEl.querySelector('.msg-content').textContent += p.delta;
        scrollBottom();
      }
      break;

    case 'item/reasoning/textDelta':
    case 'item/reasoning/summaryTextDelta': {
      const el = itemEls.get(p.itemId);
      if (el) {
        const body = el.querySelector('.reasoning-body');
        if (body) body.textContent += p.delta;
      }
      break;
    }

    case 'item/commandExecution/outputDelta': {
      const el = p.itemId ? itemEls.get(p.itemId) : null;
      if (el && el.classList.contains('tool-cmd')) {
        const detail = el.querySelector('.tool-detail');
        if (detail) {
          let t = p.delta || '';
          try { t = atob(t); } catch(_) {}
          detail.textContent += t;
          detail.classList.add('open');
          const header = el.querySelector('.tool-call-header');
          if (header) header.querySelector('.tool-toggle').classList.add('open');
        }
      }
      break;
    }

    case 'item/plan/delta': {
      const el = itemEls.get(p.itemId);
      if (el) {
        const d = el.querySelector('.tool-detail');
        if (d) { d.textContent += p.delta; d.classList.add('open'); }
      }
      break;
    }

    case 'error':
      addSystemMsg('错误: ' + (p.error?.message || p.error || '未知'), true);
      isStreaming = false;
      hideTypingIndicator();
      updateSendBtn();
      break;

    case 'warning':
      addSystemMsg('⚠ ' + (p.message || '')); break;
  }
}

// ============================================================
// ITEMS
// ============================================================

function handleItemStarted(item) {
  if (!item) return;
  const t = item.type;

  if (t === 'agentMessage') {
    const group = createMsgGroup('assistant');
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble agent streaming';
    bubble.dataset.itemId = item.id;
    const content = document.createElement('div');
    content.className = 'msg-content';
    bubble.appendChild(content);
    group.querySelector('.msg-body').appendChild(bubble);

    streamingItemId = item.id;
    streamingEl = bubble;
    itemEls.set(item.id, bubble);
    return;
  }

  if (t === 'reasoning') {
    const block = createReasoning(item);
    itemEls.set(item.id, block);
    return;
  }

  // Tool calls
  const cfg = toolConfig(item);
  if (cfg) {
    const el = createToolCall(item.id, cfg);
    itemEls.set(item.id, el);
  }

  if (t === 'contextCompaction') addSystemMsg('📦 上下文已压缩');
  if (t === 'enteredReviewMode') addSystemMsg('进入审查模式');
  if (t === 'exitedReviewMode') addSystemMsg('退出审查模式');
}

function handleItemCompleted(item) {
  if (!item) return;
  const t = item.type;
  const el = itemEls.get(item.id);

  if (t === 'agentMessage' && el) {
    el.classList.remove('streaming');
    if (item.text) el.querySelector('.msg-content').textContent = item.text;
    streamingItemId = null;
    streamingEl = null;
  }

  if (t === 'reasoning' && el) {
    const body = el.querySelector('.reasoning-body');
    if (body) {
      const parts = [];
      if (item.summary?.length) parts.push(item.summary.join('\n'));
      if (item.content?.length) parts.push(item.content.join('\n'));
      if (parts.length) body.textContent = parts.join('\n\n');
    }
  }

  if (el?.classList.contains('tool-call')) {
    const statusEl = el.querySelector('.tool-status');
    const titleEl = el.querySelector('.tool-title');
    const detailEl = el.querySelector('.tool-detail');

    if (t === 'commandExecution') {
      const ok = item.exitCode === 0;
      setToolStatus(statusEl, ok ? 'done' : (item.exitCode != null ? 'failed' : 'done'));
      if (titleEl && item.command) {
        titleEl.textContent = item.command + (item.durationMs ? '  (' + (item.durationMs/1000).toFixed(1) + 's)' : '');
      }
      if (detailEl && item.aggregatedOutput) {
        detailEl.textContent = item.aggregatedOutput;
      }
    } else if (t === 'fileChange') {
      const ok = !item.status || item.status === 'completed' || item.status === 'applied';
      setToolStatus(statusEl, ok ? 'done' : 'failed');
      if (detailEl) {
        detailEl.textContent = (item.changes || []).map(c => (c.type||'') + ' ' + (c.path||c.filePath||'')).join('\n');
      }
      if (titleEl) titleEl.textContent = (item.changes?.length||0) + ' 个文件';
    } else if (t === 'mcpToolCall') {
      setToolStatus(statusEl, item.error ? 'failed' : 'done');
    } else if (t === 'webSearch') {
      setToolStatus(statusEl, 'done');
    } else if (t === 'plan') {
      setToolStatus(statusEl, 'done');
      if (detailEl && item.text) detailEl.textContent = item.text;
    } else {
      setToolStatus(statusEl, 'done');
    }
  }

  itemEls.delete(item.id);
}

function toolConfig(item) {
  const t = item.type;
  if (t === 'commandExecution') return {
    icon: '▸', cls: 'tool-cmd', name: 'shell',
    title: item.command || '执行命令',
    detail: '', status: 'running'
  };
  if (t === 'fileChange') return {
    icon: '✎', cls: 'tool-file', name: 'file',
    title: (item.changes?.length||0) + ' 个文件',
    detail: (item.changes||[]).map(c=>(c.type||'')+' '+(c.path||c.filePath||'')).join('\n'),
    status: 'running'
  };
  if (t === 'webSearch') return {
    icon: '⌕', cls: 'tool-search', name: 'search',
    title: item.query || '搜索', detail: '', status: 'running'
  };
  if (t === 'mcpToolCall') return {
    icon: '⚙', cls: 'tool-mcp', name: item.tool || 'mcp',
    title: (item.server ? item.server+'/' : '') + (item.tool||''),
    detail: item.arguments ? JSON.stringify(item.arguments, null, 2) : '',
    status: 'running'
  };
  if (t === 'dynamicToolCall') return {
    icon: '⚙', cls: 'tool-mcp', name: item.tool || 'tool',
    title: (item.namespace?item.namespace+'/':'')+(item.tool||''),
    detail: item.arguments?JSON.stringify(item.arguments,null,2):'',
    status: 'running'
  };
  if (t === 'plan') return {
    icon: '☰', cls: 'tool-plan', name: 'plan',
    title: '规划', detail: item.text || '', status: 'running'
  };
  if (t === 'subAgentActivity') return {
    icon: '◉', cls: 'tool-agent', name: 'agent',
    title: (item.kind||'') + ' → ' + (item.agentPath||''),
    detail: '', status: 'running'
  };
  return null;
}

function setToolStatus(el, status) {
  if (!el) return;
  el.className = 'tool-status ' + status;
  el.textContent = status === 'done' ? '完成' : status === 'failed' ? '失败' : '运行中';
}

// ============================================================
// DOM BUILDERS
// ============================================================

function createMsgGroup(role) {
  const msgs = document.getElementById('messages');
  const group = document.createElement('div');
  group.className = 'msg-group';

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar ' + role;
  avatar.textContent = role === 'user' ? '你' : '⚡';

  const body = document.createElement('div');
  body.className = 'msg-body';

  const sender = document.createElement('div');
  sender.className = 'msg-sender';
  sender.innerHTML = role === 'user'
    ? '你 <span class="msg-time">' + currentTime() + '</span>'
    : 'dsx <span class="msg-time">' + currentTime() + '</span>';
  body.appendChild(sender);

  group.appendChild(avatar);
  group.appendChild(body);
  msgs.appendChild(group);
  scrollBottom();
  return group;
}

function addUserMsg(text) {
  const group = createMsgGroup('user');
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble user';
  const content = document.createElement('div');
  content.className = 'msg-content';
  content.textContent = text;
  bubble.appendChild(content);
  group.querySelector('.msg-body').appendChild(bubble);
}

function addSystemMsg(text, isError) {
  const msgs = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'system-msg fade-in' + (isError ? ' error' : '');
  el.innerHTML = '<span>' + esc(text) + '</span>';
  msgs.appendChild(el);
  scrollBottom();
}

function createReasoning(item) {
  const group = createMsgGroup('assistant');
  const block = document.createElement('div');
  block.className = 'reasoning-block';

  const toggle = document.createElement('div');
  toggle.className = 'reasoning-toggle';
  toggle.innerHTML = '<span class="reasoning-arrow">▶</span> 思考过程';

  const body = document.createElement('div');
  body.className = 'reasoning-body';
  const parts = [];
  if (item.summary?.length) parts.push(item.summary.join('\n'));
  if (item.content?.length) parts.push(item.content.join('\n'));
  body.textContent = parts.join('\n\n');

  toggle.onclick = () => {
    body.classList.toggle('open');
    toggle.querySelector('.reasoning-arrow').classList.toggle('open');
  };

  block.appendChild(toggle);
  block.appendChild(body);
  group.querySelector('.msg-body').appendChild(block);
  return block;
}

function createToolCall(itemId, cfg) {
  const group = createMsgGroup('assistant');
  const call = document.createElement('div');
  call.className = 'tool-call ' + (cfg.cls || '');
  call.dataset.itemId = itemId;

  const header = document.createElement('div');
  header.className = 'tool-call-header';

  const hasDetail = cfg.detail && cfg.detail.length > 0;

  header.innerHTML = `
    <div class="tool-icon">${cfg.icon}</div>
    <span class="tool-name">${cfg.name}</span>
    <span class="tool-title">${esc(cfg.title)}</span>
    <span class="tool-status ${cfg.status}">${cfg.status==='done'?'完成':cfg.status==='failed'?'失败':'运行中'}</span>
    <span class="tool-toggle${hasDetail?' open':''}">▶</span>
  `;

  call.appendChild(header);

  if (hasDetail) {
    const detail = document.createElement('div');
    detail.className = 'tool-detail' + (cfg.cls === 'tool-file' ? ' file-output' : cfg.cls === 'tool-cmd' ? ' cmd-output' : '') + (hasDetail ? ' open' : '');
    detail.textContent = cfg.detail;
    call.appendChild(detail);

    header.onclick = () => {
      detail.classList.toggle('open');
      header.querySelector('.tool-toggle').classList.toggle('open');
    };
  }

  group.querySelector('.msg-body').appendChild(call);
  return call;
}

function showTypingIndicator() {
  const group = createMsgGroup('assistant');
  group.id = 'typing-group';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble agent';
  bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
  group.querySelector('.msg-body').appendChild(bubble);
}

function hideTypingIndicator() {
  const el = document.getElementById('typing-group');
  if (el) el.remove();
}

// ============================================================
// THREAD MANAGEMENT
// ============================================================

async function loadThreadList() {
  try {
    const r = await sendRpc('thread/list', {
      sortKey: 'recencyAt', sortDirection: 'desc', limit: 50
    });
    threads = r.data || [];
    renderThreadList();
  } catch(_) {}
}

function renderThreadList() {
  const list = document.getElementById('thread-list');
  const q = searchTerm.toLowerCase();
  const filtered = q
    ? threads.filter(t => (t.name||'').toLowerCase().includes(q) || (t.preview||'').toLowerCase().includes(q))
    : threads;

  list.innerHTML = '';
  for (const t of filtered) {
    const card = document.createElement('div');
    card.className = 'thread-card' + (t.id === currentThreadId ? ' active' : '');
    const statusType = t.status?.type;
    const isActive = statusType === 'active';

    const title = t.name || t.preview || '新会话';
    const time = fmtTime(t.recencyAt || t.updatedAt || t.createdAt);
    const cwd = t.cwd ? shortPath(typeof t.cwd === 'string' ? t.cwd : (t.cwd.path || t.cwd.absolutePath || '')) : '';

    card.innerHTML = `
      <div class="thread-card-top">
        <span class="thread-status-dot ${isActive?'active':'idle'}"></span>
        <span class="thread-title">${esc(title.slice(0,40))}</span>
      </div>
      <div class="thread-preview">${esc((t.preview||'').slice(0,50))}</div>
      <div class="thread-meta"><span>${esc(cwd)}</span><span>${time}</span></div>
    `;
    card.onclick = () => switchThread(t.id);
    list.appendChild(card);
  }

  if (!filtered.length) {
    list.innerHTML = '<div style="padding:20px;text-align:center;font-size:12px;color:var(--text-tertiary)">暂无会话</div>';
  }
}

async function newThread() {
  if (!connected) return;
  try {
    const r = await sendRpc('thread/start', {});
    if (r.thread) {
      currentThreadId = r.thread.id;
      currentCwd = r.cwd || (typeof r.thread.cwd === 'string' ? r.thread.cwd : r.thread.cwd?.path || '');
      currentThreadName = r.thread.name || null;
      clearMessages();
      showChat();
      updateHeader();
      updateModelBadge(r);
      enableComposer(true);
      addSystemMsg('新会话已创建');
      await loadThreadList();
    }
  } catch(e) {
    addSystemMsg('创建失败: ' + (e.message || e), true);
  }
}

async function switchThread(threadId) {
  if (!connected || threadId === currentThreadId) return;
  try {
    const r = await sendRpc('thread/resume', { threadId });
    currentThreadId = threadId;
    currentCwd = r.cwd || (typeof r.thread?.cwd === 'string' ? r.thread.cwd : r.thread?.cwd?.path || '');
    currentThreadName = r.thread?.name || null;
    updateModelBadge(r);

    const read = await sendRpc('thread/read', { threadId, includeTurns: true });
    clearMessages();
    showChat();
    updateHeader();
    enableComposer(true);

    if (read.thread?.turns) {
      for (const turn of read.thread.turns) {
        renderHistory(turn.items || []);
      }
    }
    await loadThreadList();
  } catch(e) {
    addSystemMsg('切换失败: ' + (e.message || e), true);
  }
}

function renderHistory(items) {
  for (const item of items) {
    const t = item.type;
    if (t === 'userMessage') {
      const text = (item.content || [])
        .filter(c => c.type === 'text' || c.type === 'Text')
        .map(c => c.text || '').join('\n');
      if (text) addUserMsg(text);
    } else if (t === 'agentMessage' && item.text) {
      const group = createMsgGroup('assistant');
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble agent';
      const content = document.createElement('div');
      content.className = 'msg-content';
      content.textContent = item.text;
      bubble.appendChild(content);
      group.querySelector('.msg-body').appendChild(bubble);
    } else if (t === 'reasoning') {
      createReasoning(item);
    } else if (t === 'commandExecution') {
      const cfg = toolConfig(item);
      if (cfg) {
        cfg.status = item.exitCode === 0 ? 'done' : (item.exitCode != null ? 'failed' : 'done');
        if (item.command) cfg.title = item.command + (item.durationMs ? '  (' + (item.durationMs/1000).toFixed(1) + 's)' : '');
        cfg.detail = item.aggregatedOutput || '';
        createToolCall(item.id, cfg);
      }
    } else if (t === 'fileChange') {
      const cfg = toolConfig(item);
      if (cfg) {
        cfg.status = !item.status || item.status==='completed' ? 'done' : 'failed';
        createToolCall(item.id, cfg);
      }
    } else if (t === 'webSearch') {
      const cfg = toolConfig(item);
      if (cfg) { cfg.status = 'done'; createToolCall(item.id, cfg); }
    } else if (t === 'mcpToolCall') {
      const cfg = toolConfig(item);
      if (cfg) { cfg.status = item.error ? 'failed' : 'done'; createToolCall(item.id, cfg); }
    } else if (t === 'plan') {
      const cfg = toolConfig(item);
      if (cfg) { cfg.status = 'done'; cfg.detail = item.text || ''; createToolCall(item.id, cfg); }
    }
  }
}

async function deleteThread() {
  if (!currentThreadId) return;
  if (!confirm('删除此会话？')) return;
  try {
    await sendRpc('thread/delete', { threadId: currentThreadId });
    currentThreadId = null;
    clearMessages();
    hideChat();
    enableComposer(false);
    await loadThreadList();
  } catch(e) {
    addSystemMsg('删除失败: ' + (e.message || e), true);
  }
}

function renameThread(el) {
  if (!currentThreadId) return;
  el.contentEditable = 'true';
  el.focus();
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);

  const finish = async () => {
    el.contentEditable = 'false';
    const name = el.textContent.trim();
    if (name && name !== currentThreadName) {
      try {
        await sendRpc('thread/name/set', { threadId: currentThreadId, name });
        currentThreadName = name;
        await loadThreadList();
      } catch(_) { el.textContent = currentThreadName || '新会话'; }
    } else {
      el.textContent = currentThreadName || '新会话';
    }
  };
  el.onblur = finish;
  el.onkeydown = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    if (e.key === 'Escape') { el.textContent = currentThreadName || '新会话'; el.blur(); }
  };
}

// ============================================================
// SEND / INTERRUPT
// ============================================================

function handleSend() {
  isStreaming ? interrupt() : send();
}

async function send() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || !currentThreadId || isStreaming) return;
  input.value = '';
  input.style.height = 'auto';
  addUserMsg(text);
  try {
    await sendRpc('turn/start', {
      threadId: currentThreadId,
      input: [{ type: 'text', text, textElements: [] }]
    });
  } catch(e) {
    addSystemMsg('发送失败: ' + (e.message || e), true);
  }
}

async function interrupt() {
  if (!currentThreadId) return;
  try {
    const params = { threadId: currentThreadId };
    if (currentTurnId) params.turnId = currentTurnId;
    await sendRpc('turn/interrupt', params);
    addSystemMsg('已中断');
  } catch(e) {
    addSystemMsg('中断失败: ' + (e.message || e), true);
  }
}

function updateSendBtn() {
  const btn = document.getElementById('send-btn');
  const text = document.getElementById('send-text');
  const icon = document.getElementById('send-icon');
  const hint = document.getElementById('composer-hint');

  if (isStreaming) {
    btn.classList.add('interrupt');
    text.textContent = '中断';
    icon.innerHTML = '<rect x="6" y="6" width="12" height="12" rx="1"/>';
    hint.textContent = '生成中…  Ctrl+C 中断';
  } else {
    btn.classList.remove('interrupt');
    text.textContent = '发送';
    icon.innerHTML = '<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>';
    hint.textContent = '';
  }
}

function handleInputKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
  if (e.key === 'c' && e.ctrlKey && isStreaming) { e.preventDefault(); interrupt(); }
  if (e.key === 'n' && e.ctrlKey) { e.preventDefault(); newThread(); }
}

// ============================================================
// HELPERS
// ============================================================

function clearMessages() {
  document.getElementById('messages').innerHTML = '';
  itemEls.clear();
  streamingItemId = null;
  streamingEl = null;
}

function showChat() {
  document.getElementById('chat-header').classList.remove('hidden');
  document.getElementById('empty-state').classList.add('hidden');
  document.getElementById('messages-container').style.display = '';
}

function hideChat() {
  document.getElementById('chat-header').classList.add('hidden');
  document.getElementById('empty-state').classList.remove('hidden');
}

function updateHeader() {
  document.getElementById('thread-name').textContent = currentThreadName || '新会话';
  const cwdEl = document.getElementById('thread-cwd');
  if (currentCwd) {
    cwdEl.textContent = shortPath(currentCwd);
    cwdEl.style.display = '';
  } else {
    cwdEl.style.display = 'none';
  }
}

function updateModelBadge(r) {
  const badge = document.getElementById('model-badge');
  if (r.model) badge.textContent = r.model;
  else if (r.thread?.modelProvider) badge.textContent = r.thread.modelProvider;
}

function enableComposer(enabled) {
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');
  const box = document.getElementById('composer-box');
  input.disabled = !enabled;
  sendBtn.disabled = !enabled;
  box.classList.toggle('disabled', !enabled);
  if (enabled) setTimeout(() => input.focus(), 50);
}

function onSearch(val) {
  searchTerm = val;
  renderThreadList();
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

function scrollBottom() {
  const c = document.getElementById('messages-container');
  c.scrollTop = c.scrollHeight;
}

function currentTime() {
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function fmtTime(ts) {
  if (!ts) return '';
  const now = Date.now() / 1000;
  const d = now - ts;
  if (d < 60) return '刚刚';
  if (d < 3600) return Math.floor(d/60) + '分钟前';
  if (d < 86400) return Math.floor(d/3600) + '小时前';
  if (d < 604800) return Math.floor(d/86400) + '天前';
  const dt = new Date(ts * 1000);
  return (dt.getMonth()+1) + '/' + dt.getDate();
}

function shortPath(p) {
  if (!p) return '';
  const parts = p.replace(/\/$/, '').split('/');
  if (parts.length <= 3) return p;
  return '…/' + parts.slice(-2).join('/');
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ============================================================
// INIT
// ============================================================

hideChat();
enableComposer(false);

// Auto-connect on page load (try default URL)
const urlParams = new URLSearchParams(window.location.search);
const autoUrl = urlParams.get('ws');
if (autoUrl) {
  document.getElementById('ws-url').value = autoUrl;
}
// Always try to connect automatically
setTimeout(() => {
  if (!connected) connect();
}, 300);
</script>
